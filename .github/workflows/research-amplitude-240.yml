name: Predict V3c - 240 minute matched revalidation
on:
  push:
    branches: [research/expected-net-return-v3-20261124]
    paths:
      - scripts/research_amplitude_240.py
      - tests/test_research_amplitude_240.py
      - .github/workflows/research-amplitude-240.yml
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scikit-learn==1.6.1
      - run: python -m unittest discover -s tests -p 'test_research_amplitude_*.py' -v
      - uses: actions/download-artifact@v7
        with:
          run-id: 45432136926
          github-token: ${{ github.token }}
          name: predict-v2-e1-coverage
          path: frozen-raw/
      - uses: actions/download-artifact@v7
        with:
          run-id: 45434595239
          github-token: ${{ github.token }}
          name: predict-v2-e2-dataset
          path: frozen-dataset/
      - run: python -m scripts.research_amplitude_240 --raw frozen-raw --dataset frozen-dataset --output reports/predict-v3c
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predict-v3c-240
          path: reports/predict-v3c/
          retention-days: 30
