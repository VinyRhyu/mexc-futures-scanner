name: Predict V6a - microstructure source coverage
on:
  push:
    branches: [research/expected-net-return-v3-20261124]
    paths:
      - scripts/research_microstructure_coverage.py
      - tests/test_research_microstructure_coverage.py
      - .github/workflows/research-microstructure-coverage.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_research_microstructure_coverage.py -v
      - run: python -m scripts.research_microstructure_coverage --output reports/predict-v6a
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predict-v6a-source-coverage
          path: reports/predict-v6a/
          retention-days: 60
