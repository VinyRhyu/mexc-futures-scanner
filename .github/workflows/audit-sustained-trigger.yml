name: Comparar sustentação de dois candles M1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_sustained_trigger.py'
      - 'tests/test_audit_sustained_trigger.py'
      - '.github/workflows/audit-sustained-trigger.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar níveis congelados e causalidade
        run: python -m unittest tests.test_audit_sustained_trigger -q
      - name: Recuperar exatamente a coleta anterior
        uses: actions/download-artifact@v8.0.2
        with:
          name: early-trigger-history-42879077420
          run-id: 42879077420
          github-token: ${{ github.token }}
          path: reports/early-trigger-source/
      - name: Reproduzir baseline e testar a sustentação
        run: python -m scripts.audit_sustained_trigger
      - name: Guardar todos os resultados
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sustained-trigger-history-${{ github.run_id }}
          path: reports/sustained-trigger-history/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
