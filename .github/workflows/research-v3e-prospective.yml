name: Predict V3e - prospective evaluator
on:
  push:
    branches: [research/expected-net-return-v3-20261124]
    paths:
      - scripts/research_v3e_prospective.py
      - tests/test_research_v3e_prospective.py
      - .github/workflows/research-v3e-prospective.yml
      - config/research/run-prospective-v3e.txt
permissions:
  contents: read
jobs:
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scikit-learn==1.6.1
      - run: python -m unittest discover -s tests -p test_research_v3e_prospective.py -v
      - run: python -m scripts.research_v3e_prospective --preflight
      - name: Explicitly armed evaluation only
        run: |
          if test -f config/research/run-prospective-v3e.txt; then
            test "$(cat config/research/run-prospective-v3e.txt)" = "2026-12-09/2026-12-23"
            python -m scripts.research_v3e_prospective
          else
            echo "Preflight only; evaluation not armed."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predict-v3e-prospective
          path: reports/predict-v3e-prospective/
          if-no-files-found: ignore
          retention-days: 60
