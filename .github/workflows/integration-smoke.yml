name: Testar coleta MEXC
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integration-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Coletar cinco contratos em simulação
        run: python -m mexc_scanner scan --init --limit 5 --output reports/integration
      - name: Conferir cobertura completa da coleta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/integration/report.json').read_text())
          assert report['source_status'] == 'OK', report.get('diagnostics')
          assert report['selected_symbols'] == report['analyzed_symbols'] == 5, report.get('diagnostics')
          print('Coleta de cinco contratos validada. Nenhuma ordem ou mensagem enviada.')
          PY
      - name: Publicar diagnóstico no resumo
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          report = Path('reports/integration/report.md')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(report.read_text() if report.exists() else 'A coleta não produziu relatório; conferir o log.')
          PY
  state-rounds:
    needs: public-api
    permissions:
      contents: write
    concurrency:
      group: scanner-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Persistir primeira rodada de até 50 contratos, sem Telegram
        run: python -m scripts.run_round --limit 50
      - name: Recuperar estado remoto em pasta nova
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('.scanner-state').rename('.first-round-state')
          PY
          python -m scripts.run_round --limit 50
      - name: Conferir continuidade e cobertura
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          first = json.loads(Path('.first-round-state/state.json').read_text())
          state = json.loads(Path('.scanner-state/state.json').read_text())
          report = json.loads(Path('.scanner-state/latest/report.json').read_text())
          assert first['config_fingerprint'] == state['config_fingerprint']
          assert first['wallet'] == state['wallet'], 'A coleta não deve alterar a carteira sem registros de operação'
          assert report['source_status'] == 'OK', report.get('diagnostics')
          assert report['analyzed_symbols'] == report['selected_symbols'], report.get('diagnostics')
          assert 5 <= report['selected_symbols'] <= 50, 'Validar todos os elegíveis, até o limite de 50'
          assert state['last_success'] >= first['last_success']
          print(f"Persistência remota e segunda rodada verificadas: {report['analyzed_symbols']}/{report['selected_symbols']} contratos. Telegram não configurado neste teste.")
          PY
