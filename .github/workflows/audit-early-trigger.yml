name: Comparar gatilho antecipado em histórico
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_early_trigger.py'
      - 'tests/test_audit_early_trigger.py'
      - '.github/workflows/audit-early-trigger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar causalidade e comparação pareada
        run: python -m unittest tests.test_audit_early_trigger -q
      - name: Coletar histórico e comparar gatilhos M1 e M15
        run: python -m scripts.audit_early_trigger
      - name: Guardar coleta, todas as formações e resultados
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: early-trigger-history-${{ github.run_id }}
          path: reports/early-trigger-history/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
