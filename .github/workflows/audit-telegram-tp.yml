name: Validar TP dos alertas de hoje
on:
  push:
    branches: ['audit/tp-hype-link-2026-11-14']
    paths: ['.github/workflows/audit-telegram-tp.yml']
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Coletar candles públicos dos avisos enviados hoje sem ordens ou Telegram
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from mexc_scanner.mexc import MexcClient
          from mexc_scanner.market import parse_candles
          from mexc_scanner.models import jsonable
          cohort = json.loads(Path('config/audit-telegram-tp-2026-11-14.json').read_text())
          client = MexcClient()
          now = client.server_time()
          start = cohort['day_start']
          assert start < now < start + 86400
          output = Path('reports/target-validation')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'cohort.json').write_text(json.dumps(cohort))
          for symbol in sorted({case['symbol'] for case in cohort['cases']}):
              raw = client._get('/api/v1/contract/kline/' + symbol,
                                dict(interval='Min1', start=start, end=now))
              candles = parse_candles(raw, 60, now)
              assert candles and candles[0].ts <= start
              assert candles[-1].end >= ((now-10)//60)*60
              record = dict(source='MEXC_PUBLIC_FUTURES', captured_at=now, symbol=symbol,
                            candles=jsonable(candles), raw=jsonable(raw))
              (output / (symbol + '.json')).write_text(json.dumps(record))
              print(json.dumps(dict(symbol=symbol, candles=len(candles),
                                    first=candles[0].ts, last=candles[-1].end)), flush=True)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: telegram-tp-all-2026-11-14
          path: reports/target-validation/
          retention-days: 14
