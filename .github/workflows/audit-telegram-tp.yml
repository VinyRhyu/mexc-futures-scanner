name: Validar parâmetros públicos dos contratos
on:
  push:
    branches: ['audit/tp-hype-link-2026-11-14']
    paths: ['.github/workflows/audit-telegram-tp.yml']
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ler catálogo público sem ordens ou Telegram
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from mexc_scanner.mexc import MexcClient
          from mexc_scanner.models import jsonable, Contract
          cohort = json.loads(Path('config/audit-telegram-tp-2026-11-14.json').read_text())
          symbols = {case['symbol'] for case in cohort['cases']}
          client = MexcClient()
          now = client.server_time()
          contracts = [c for c in client.contracts() if c['symbol'] in symbols]
          for row in contracts:
              Contract.from_api(row)
          output = Path('reports/contract-validation')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'contracts.json').write_text(json.dumps(jsonable(dict(captured_at=now, contracts=contracts))))
          print(json.dumps(dict(contracts=len(contracts), captured_at=now)), flush=True)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mexc-contracts-2026-11-14
          path: reports/contract-validation/
          retention-days: 14
