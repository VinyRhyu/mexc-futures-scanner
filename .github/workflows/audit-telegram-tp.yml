name: Coletar M1 completo para estrutura e reteste
on:
  push:
    branches: ['audit/tp-hype-link-2026-11-14']
    paths: ['.github/workflows/audit-telegram-tp.yml']
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ler M1 histórico com aquecimento sem ordens ou Telegram
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from mexc_scanner.mexc import MexcClient
          from mexc_scanner.market import parse_candles
          from mexc_scanner.models import jsonable
          cohort = json.loads(Path('config/audit-day-confirmed-2026-11-14.json').read_text())
          first = json.loads(Path('config/audit-telegram-tp-2026-11-14.json').read_text())['day_start']
          cutoff = cohort['price_cutoff']
          client = MexcClient()
          captured = client.server_time()
          assert captured >= cutoff+10
          start = first - 21600
          output = Path('reports/structure-retest-source')
          output.mkdir(parents=True, exist_ok=True)
          for symbol in sorted({r['symbol'] for r in cohort['records']}):
              raw = client._get('/api/v1/contract/kline/'+symbol,
                                dict(interval='Min1', start=start, end=cutoff+10))
              bars = parse_candles(raw, 60, cutoff+10)
              assert bars[0].ts == start and bars[-1].end == cutoff
              record = dict(symbol=symbol, captured_at=captured, day_start=first,
                            price_cutoff=cutoff, candles=jsonable(bars))
              (output / (symbol+'.json')).write_text(json.dumps(record))
              print(json.dumps(dict(symbol=symbol, candles=len(bars), first=bars[0].ts,
                                    last=bars[-1].end)), flush=True)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: structure-retest-source-2026-11-14
          path: reports/structure-retest-source/
          retention-days: 14
