name: Coletar H1 para teste de filtro único
on:
  push:
    branches: ['audit/tp-hype-link-2026-11-14']
    paths: ['.github/workflows/audit-telegram-tp.yml']
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Buscar H1 histórico sem ordens ou Telegram
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from mexc_scanner.mexc import MexcClient
          from mexc_scanner.market import parse_candles
          from mexc_scanner.models import jsonable
          cohort = json.loads(Path('config/audit-telegram-tp-2026-11-14.json').read_text())
          client = MexcClient()
          captured = client.server_time()
          cutoff = 1794687420
          assert captured >= cutoff
          output = Path('reports/h1-filter')
          output.mkdir(parents=True, exist_ok=True)
          for symbol in sorted({c['symbol'] for c in cohort['cases']}):
              raw = client.candles(symbol, 'Min60', 280, cutoff)
              bars = parse_candles(raw, 3600, cutoff, 280)
              assert bars[0].ts < cohort['day_start'] - 240*3600
              record = dict(symbol=symbol, captured_at=captured, historical_cutoff=cutoff,
                            candles=jsonable(bars), raw=jsonable(raw))
              (output / (symbol+'.json')).write_text(json.dumps(record))
              print(json.dumps(dict(symbol=symbol, count=len(bars), first=bars[0].ts,
                                    last=bars[-1].end)), flush=True)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: h1-filter-source-2026-11-14
          path: reports/h1-filter/
          retention-days: 14
