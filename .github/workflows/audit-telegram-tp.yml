name: Validar progressao SHORT em nova semana M1 - recuperar catalogo
on:
  push:
    branches: ['audit/tp-hype-link-2026-11-14']
    paths: ['.github/workflows/audit-telegram-tp.yml']
permissions:
  contents: read
jobs:
  public-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Coletar apenas historico publico M1 M15 H1
        run: python -m scripts.collect_m1_progress_validation
      - name: Comparar regra congelada sem alterar producao
        run: python -m scripts.audit_m1_short_progress_validation --source reports/m1-progress-new-week --protocol config/audit-m1-short-progress-new-week-2026-11-15.json --output reports/m1-progress-new-week/result.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: m1-short-progress-new-week-2026-11-15
          path: reports/m1-progress-new-week/
          retention-days: 30
