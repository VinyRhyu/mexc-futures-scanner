name: Pesquisa ORCA — elegibilidade MEXC
on:
  pull_request:
    paths:
      - 'scripts/probe_orca_universe.py'
      - 'config/crypto-assets.json'
      - '.github/workflows/research-orca-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Teste publico isolado — nenhuma ordem ou Telegram
        run: python -m scripts.probe_orca_universe
