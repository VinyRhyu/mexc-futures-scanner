name: Predict V2 - E4 prospective evaluator
on:
  push:
    branches: [research/pre-breakout-forecast-v2-20261124]
    paths:
      - config/research/predict-v2-frozen-short.json
      - scripts/research_pre_breakout_prospective.py
      - tests/test_research_pre_breakout_prospective.py
      - .github/workflows/research-pre-breakout-prospective.yml
      - config/research/run-prospective-e4.txt
permissions:
  contents: read
jobs:
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scikit-learn==1.6.1
      - run: python -m unittest discover -s tests -p test_research_pre_breakout_prospective.py -v
      - run: python -m scripts.research_pre_breakout_prospective --preflight
      - name: Explicitly armed evaluation only, after full window
        run: |
          if test -f config/research/run-prospective-e4.txt; then
            test "$(cat config/research/run-prospective-e4.txt)" = "2026-11-25/2026-12-09"
            python -m scripts.research_pre_breakout_prospective
          else
            echo "Preflight only; evaluation not armed."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predict-v2-e4-prospective
          path: reports/predict-v2-prospective/
          if-no-files-found: ignore
          retention-days: 30
