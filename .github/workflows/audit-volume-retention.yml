name: Testar sustentação de metade do volume
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_volume_retention.py'
      - 'tests/test_volume_retention.py'
      - '.github/workflows/audit-volume-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar níveis congelados e causalidade
        run: python -m unittest tests.test_volume_retention -q
      - name: Recuperar exatamente a coleta anterior
        uses: actions/download-artifact@v8.0.2
        with:
          name: early-trigger-history-42879077420
          run-id: 42879077420
          github-token: ${{ github.token }}
          path: reports/early-trigger-source/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: trigger-volume-42906417587
          run-id: 42906417587
          github-token: ${{ github.token }}
          path: reports/trigger-volume-source/
      - run: python -m scripts.audit_volume_retention
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: volume-retention-${{ github.run_id }}
          path: reports/volume-retention/
          retention-days: 30
