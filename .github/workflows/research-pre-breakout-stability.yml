name: Predict V2 - E3b stability audit
on:
  push:
    branches: [research/pre-breakout-forecast-v2-20261124]
    paths:
      - scripts/research_pre_breakout_stability.py
      - tests/test_research_pre_breakout_stability.py
      - .github/workflows/research-pre-breakout-stability.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scikit-learn==1.6.1
      - run: python -m unittest discover -s tests -p test_research_pre_breakout_stability.py -v
      - uses: actions/download-artifact@v7
        with:
          run-id: 45434889849
          github-token: ${{ github.token }}
          name: predict-v2-e3-model
          path: frozen-model/
      - run: python -m scripts.research_pre_breakout_stability --input frozen-model --output reports/predict-v2-stability
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predict-v2-e3b-stability
          path: reports/predict-v2-stability/
          retention-days: 30
