name: Predict V3e - freeze 240m candidate
on:
  push:
    branches: [research/expected-net-return-v3-20261124]
    paths:
      - scripts/research_amplitude_freeze.py
      - .github/workflows/research-amplitude-freeze.yml
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scikit-learn==1.6.1
      - run: python -m unittest discover -s tests -p 'test_research_amplitude_*.py' -v
      - uses: actions/download-artifact@v7
        with:
          run-id: 45432136926
          github-token: ${{ github.token }}
          name: predict-v2-e1-coverage
          path: frozen-raw/
      - uses: actions/download-artifact@v7
        with:
          run-id: 45434595239
          github-token: ${{ github.token }}
          name: predict-v2-e2-dataset
          path: frozen-dataset/
      - run: python -m scripts.research_amplitude_freeze --raw frozen-raw --dataset frozen-dataset --output reports/predict-v3e
      - uses: actions/upload-artifact@v7
        with:
          name: predict-v3e-freeze
          path: reports/predict-v3e/
          retention-days: 60
