name: Predict V2 - E1 coverage pilot
on:
  push:
    branches:
      - research/pre-breakout-forecast-v2-20261124
    paths:
      - scripts/research_pre_breakout_coverage.py
      - tests/test_research_pre_breakout_coverage.py
      - .github/workflows/research-pre-breakout-coverage.yml
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test read-only coverage collector
        run: python -m unittest discover -s tests -p test_research_pre_breakout_coverage.py -v
      - name: Audit MEXC 60-day coverage
        run: python -m scripts.research_pre_breakout_coverage
      - name: Add audit summary
        if: always()
        run: |
          if test -f reports/predict-v2-coverage/report.md; then
            cat reports/predict-v2-coverage/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predict-v2-e1-coverage
          path: reports/predict-v2-coverage/
          retention-days: 14
