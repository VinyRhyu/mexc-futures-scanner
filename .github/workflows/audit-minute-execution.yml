name: Auditar 19 entradas com candles 1m
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_minute_execution.py'
      - 'tests/test_audit_minute_execution.py'
      - 'config/audit-m1-cohort.json'
      - '.github/workflows/audit-minute-execution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar sequência dos preços e cancelamentos
        run: python -m unittest tests.test_audit_minute_execution -q
      - name: Buscar candles públicos e auditar entradas congeladas
        run: python -m scripts.audit_minute_execution
