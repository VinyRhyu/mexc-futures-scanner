name: Testar Telegram
on:
  push:
    branches: [main]
    paths:
      - mexc_scanner/reporting.py
      - scripts/telegram_preview.py
      - .github/workflows/telegram-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar o formato antes do envio
        run: python -m unittest discover -s tests -q
      - name: Enviar uma amostra fictícia do formato
        run: python -m scripts.telegram_preview --send
