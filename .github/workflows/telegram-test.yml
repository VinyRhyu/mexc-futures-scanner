name: Testar Telegram
on:
  push:
    branches: [main]
    paths:
      - mexc_scanner/reporting.py
      - scripts/telegram_preview.py
      - .github/workflows/telegram-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar o formato antes do envio
        run: python -m unittest discover -s tests -q
      - name: Pré-visualizar formato fictício apenas nos logs (sem enviar Telegram)
        run: python -m scripts.telegram_preview
