name: Predict V3 - frozen trade cost attribution
on:
  push:
    branches: [research/expected-net-return-v3-20261124]
    paths:
      - scripts/research_expected_net_attribution.py
      - tests/test_research_expected_net_attribution.py
      - .github/workflows/research-expected-net-attribution.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scikit-learn==1.6.1
      - run: python -m unittest discover -s tests -p test_research_expected_net_attribution.py -v
      - uses: actions/download-artifact@v7
        with:
          run-id: 45434595239
          github-token: ${{ github.token }}
          name: predict-v2-e2-dataset
          path: frozen-dataset/
      - uses: actions/download-artifact@v7
        with:
          run-id: 45442069393
          github-token: ${{ github.token }}
          name: predict-v3-expected-net-return
          path: frozen-v3/
      - run: python -m scripts.research_expected_net_attribution --dataset frozen-dataset --v3 frozen-v3 --output reports/predict-v3-attribution
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predict-v3-attribution
          path: reports/predict-v3-attribution/
          retention-days: 30
