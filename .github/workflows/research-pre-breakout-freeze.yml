name: Predict V2 - E4 freeze SHORT hypothesis
on:
  push:
    branches: [research/pre-breakout-forecast-v2-20261124]
    paths:
      - scripts/research_pre_breakout_freeze.py
      - .github/workflows/research-pre-breakout-freeze.yml
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scikit-learn==1.6.1
      - uses: actions/download-artifact@v7
        with:
          run-id: 45434595239
          github-token: ${{ github.token }}
          name: predict-v2-e2-dataset
          path: frozen-dataset/
      - uses: actions/download-artifact@v7
        with:
          run-id: 45434889849
          github-token: ${{ github.token }}
          name: predict-v2-e3-model
          path: frozen-predictions/
      - run: python -m scripts.research_pre_breakout_freeze --dataset frozen-dataset --predictions frozen-predictions --output reports/predict-v2-freeze
      - uses: actions/upload-artifact@v7
        with:
          name: predict-v2-e4-freeze
          path: reports/predict-v2-freeze/
          retention-days: 30
