name: Predict V3g - expansion coverage
on:
  push:
    branches: [research/expected-net-return-v3-20261124]
    paths:
      - scripts/research_universe_expansion.py
      - tests/test_research_universe_expansion.py
      - .github/workflows/research-universe-expansion.yml
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_research_universe_expansion.py -v
      - uses: actions/download-artifact@v7
        with:
          run-id: 45432136926
          github-token: ${{ github.token }}
          name: predict-v2-e1-coverage
          path: frozen-raw/
      - run: python -m scripts.research_universe_expansion --raw frozen-raw --output reports/predict-v3g
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predict-v3g-expansion-coverage
          path: reports/predict-v3g/
          retention-days: 60
