name: Predict V3i - universe up to 100
on:
  push:
    branches: [research/expected-net-return-v3-20261124]
    paths:
      - scripts/research_universe_100.py
      - tests/test_research_universe_100.py
      - .github/workflows/research-universe-100.yml
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_research_universe_100.py -v
      - uses: actions/download-artifact@v7
        with:
          run-id: 45432136926
          github-token: ${{ github.token }}
          name: predict-v2-e1-coverage
          path: frozen-raw/
      - uses: actions/download-artifact@v7
        with:
          run-id: 45449303295
          github-token: ${{ github.token }}
          name: predict-v3h-universe-50
          path: previous/
      - run: python -m scripts.research_universe_100 --raw frozen-raw --previous previous --output reports/predict-v3i
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predict-v3i-universe-100
          path: reports/predict-v3i/
          retention-days: 60
