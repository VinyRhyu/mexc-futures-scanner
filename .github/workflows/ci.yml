name: Testes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Testes sem rede e demonstração sintética
        run: |
          python -m unittest discover -s tests -v
          python -m mexc_scanner demo
          python -m mexc_scanner replay reports/demo/snapshot.json --output reports/demo-replay
      - name: Avaliacao isolada MEXC 21 dias (somente PR, sem ordens)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python -m scripts.audit_confluence_extended --days 21
