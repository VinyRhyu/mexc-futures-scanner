name: Testes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Testes sem rede e demonstração sintética
        run: |
          python -m unittest discover -s tests -v
          python -m mexc_scanner demo
          python -m mexc_scanner replay reports/demo/snapshot.json --output reports/demo-replay
      - name: HYPE 8 movimentos - auditoria M5 H1 sem olhar futuro
        if: github.event_name == 'pull_request'
        timeout-minutes: 9
        run: python -m scripts.audit_hype_eight_moves_20261120
