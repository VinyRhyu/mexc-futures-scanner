name: Testes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Testes sem rede e demonstração sintética
        run: |
          python -m unittest discover -s tests -v
          python -m mexc_scanner demo
          python -m mexc_scanner replay reports/demo/snapshot.json --output reports/demo-replay
      - name: HYPE tres familias de sinais 168d + semana atual
        if: github.event_name == 'pull_request'
        timeout-minutes: 16
        run: |
          set -e
          for w in T U V W WK; do
            echo "=== REGIME HYPE $w ==="
            python -m scripts.audit_hype_three_regimes --window "$w"
          done
